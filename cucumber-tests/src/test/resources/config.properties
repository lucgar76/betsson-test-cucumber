# Appium Configuration Properties
# Configure these properties according to your test environment

# Appium Server Configuration
appium.server.url=http://127.0.0.1:4723

# Platform Configuration
platform.name=Android
platform.version=
device.name=Android Emulator

# Automation Configuration
automation.name=UiAutomator2

# App Configuration
# Option 1: Use APK file path (recommended for fresh installs)
app.path=../android/app/build/outputs/apk/debug/app-debug.apk

# Option 2: Use app package and activity (if app is already installed)
# Comment out app.path and uncomment these lines to use installed app
app.package=com.swaglabsmobileapp
app.activity=.MainActivity

# Reset Options
# noReset: Don't reset app state before session (keeps logged-in state, data, etc.)
# fullReset: Full reset - uninstall and reinstall app
no.reset=false
full.reset=false

# Timeout Configuration (in seconds)
implicit.wait=10
explicit.wait=15

# Test Data
# Valid test credentials from the app
test.username.valid=standard_user
test.password.valid=secret_sauce
test.username.locked=locked_out_user

# Notes:
# - Make sure Appium server is running before executing tests
# - Update app.path to point to your actual APK file location
# - For physical device testing, update device.name to your device name
# - For iOS testing, update platform.name to iOS and automation.name to XCUITest
