# Cucumber Configuration Properties

# Pretty print console output
cucumber.ansi-colors.disabled=false

# Execution options
cucumber.execution.dry-run=false
cucumber.execution.parallel.enabled=false

# Plugin configuration
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, junit:target/cucumber-reports/cucumber.xml

# Glue path (step definitions package)
cucumber.glue=com.swaglabsmobileapp.stepdefinitions

# Feature file location
cucumber.features=src/test/resources/features

# Snippet type for undefined steps
cucumber.snippet-type=camelcase

# Publish results to Cucumber Reports Service
cucumber.publish.enabled=true
cucumber.publish.quiet=false

# Filter scenarios by tags
# Uncomment and modify to run specific tags
# cucumber.filter.tags=@smoke
# cucumber.filter.tags=@positive
# cucumber.filter.tags=@negative
# cucumber.filter.tags=@login and @smoke
# cucumber.filter.tags=not @wip

# Object factory
cucumber.object-factory=io.cucumber.core.backend.DefaultObjectFactory

# Strict mode - fail if there are undefined or pending steps
# This is now deprecated - use fail-on-undefined-step and fail-on-pending-step instead
# cucumber.strict=true
